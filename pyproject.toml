[project]
name = "agentsys"
version = "0.1.0"
description = "Claude API 기반 도구 사용 에이전트 + 멀티 에이전트 오케스트레이션 연습 프로젝트"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=1.6.0",
    "pydantic>=2.0",
    "yfinance>=0.2.50",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
agentsys = "agentsys.cli:main"
stockmom = "stockmom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsys", "src/stockmom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
