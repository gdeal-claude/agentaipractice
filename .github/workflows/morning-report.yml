# 평일 아침 7시(한국 시간)에 리포트를 만들어 이메일로 보내고, reports/ 폴더에도 저장합니다.
# 설정: 저장소 Settings > Secrets and variables > Actions 에 아래 secret 을 등록하세요.
#   ANTHROPIC_API_KEY, SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASSWORD, MAIL_TO
name: morning-report

on:
  schedule:
    - cron: "0 22 * * 0-4"   # UTC 22:00 일~목 = KST 07:00 월~금
  workflow_dispatch:         # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: 리포트 생성 + 이메일
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: stockmom morning --email
      - name: 리포트를 저장소에 남기기
        run: |
          git config user.name "morning-report-bot"
          git config user.email "bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "아침 리포트 $(date -u +%Y-%m-%d)"
          git push
